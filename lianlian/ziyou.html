<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漣心 · 聲音水池</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; position:fixed; inset:0; touch-action:none;
    font-family:"Noto Serif TC",serif; color:#27486b; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  #pool{ position:fixed; inset:0; background:linear-gradient(180deg,#dcf0fb 0%, #cfe8f7 45%, #b9d9ef 100%); overflow:hidden; }

  .corner{ position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30;
    height:clamp(42px,6vmin,72px); border-radius:999px; border:none; cursor:pointer;
    background:rgba(90,150,200,0.16); color:#2f6394; font-size:clamp(14px,2.3vmin,24px);
    display:flex; align-items:center; justify-content:center; line-height:1.05; }
  #infoBtn{ left:max(12px, env(safe-area-inset-left)); width:clamp(42px,6vmin,72px); }
  #soundBtn{ right:max(12px, env(safe-area-inset-right)); width:clamp(42px,6vmin,72px); }
  #homeBtn{ right:calc(max(12px, env(safe-area-inset-right)) + clamp(42px,6vmin,72px) + 8px);
    padding:0 clamp(12px,1.8vmin,20px); gap:5px; font-size:clamp(13px,2.1vmin,22px); white-space:nowrap; }

  header{ position:fixed; top:0; left:0; right:0; z-index:10; text-align:center;
    padding:max(64px,calc(env(safe-area-inset-top) + 60px)) 12px 0; pointer-events:none; }
  .face{ width:clamp(50px,10vmin,110px); height:clamp(50px,10vmin,110px); margin:0 auto; position:relative;
    border-radius:50%; background:radial-gradient(circle at 35% 32%, #fff, #eaf4fb 70%, #bfddf4);
    border:2px solid rgba(111,168,220,0.5); transition:transform .16s ease; }
  .face.bounce{ transform:translateY(-8px) scale(1.06); }
  .face .eye{ position:absolute; top:42%; width:10%; height:14%; border-radius:50%; background:#3a6694; }
  .face .eye.l{ left:32%; } .face .eye.r{ right:32%; }
  .face .mouth{ position:absolute; left:34%; right:34%; top:56%; height:20%; border-bottom:clamp(3px,0.6vmin,6px) solid #3a6694; border-radius:0 0 999px 999px; }
  .face .cheek{ position:absolute; top:52%; width:11%; height:8%; border-radius:50%; background:rgba(247,168,170,.5); }
  .face .cheek.l{ left:20%; } .face .cheek.r{ right:20%; }
  .sub{ font-size:clamp(13px,2.2vmin,24px); color:#5a7795; margin-top:6px; }

  .ripple{ position:absolute; border-radius:50%; border:2px solid; transform:translate(-50%,-50%); pointer-events:none;
    animation:rip 1.1s ease-out forwards; }
  @keyframes rip{ 0%{ width:10px; height:10px; opacity:.8; } 100%{ width:34vmin; height:34vmin; opacity:0; } }

  .overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(28px,4vmin,64px); color:#27486b;
    background:radial-gradient(circle at 50% 36%, rgba(255,255,255,0.92), rgba(210,232,247,0.97)); transition:opacity .5s ease; }
  .overlay.hide{ opacity:0; pointer-events:none; }
  .hero{ font-size:clamp(52px,12vmin,150px); margin-bottom:10px; filter:drop-shadow(0 8px 20px rgba(90,150,200,0.35)); }
  .lead{ font-size:clamp(24px,5.4vmin,60px); font-weight:500; line-height:1.5; margin-bottom:12px; }
  .otext{ font-size:clamp(15px,3vmin,28px); color:#5a7795; line-height:1.9; max-width:22em; }
  .obtn{ margin-top:22px; padding:clamp(14px,2vmin,26px) clamp(44px,6.5vmin,100px); border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:clamp(20px,3.4vmin,44px); font-weight:500; color:#fff; background:#4E86BE; box-shadow:0 10px 26px rgba(78,134,190,0.4); }
  .obtn.ghost{ background:transparent; color:inherit; border:2px solid currentColor; box-shadow:none; margin-top:14px; }
  .obtn.small{ background:transparent; color:inherit; border:none; box-shadow:none; opacity:.7; margin-top:4px; font-size:clamp(16px,2.4vmin,28px); }
  #parent .panel{ max-width:32em; text-align:left; background:rgba(255,255,255,0.92); border:1px solid rgba(90,150,200,0.2);
    border-radius:22px; padding:clamp(26px,3vmin,40px) clamp(24px,3vmin,38px); }
  #parent h2{ font-size:clamp(22px,3.4vmin,40px); font-weight:700; margin-bottom:8px; }
  #parent p{ font-size:clamp(15.5px,2.4vmin,28px); line-height:1.9; color:#43617f; margin-bottom:12px; }
  #parent p b{ color:#2f6394; }
</style>
</head>
<body>
<script>
window.onerror=function(msg,src,line){ try{ var d=document.getElementById('__err');
  if(!d){ d=document.createElement('div'); d.id='__err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;font:14px/1.6 -apple-system,sans-serif;padding:12px;white-space:pre-wrap';
    (document.body||document.documentElement).appendChild(d); }
  d.textContent='\u26a0 \u7a0b\u5f0f\u932f\u8aa4\uff1a'+msg+'\u3000(\u884c '+line+')'; }catch(e){} return false; };
</script>

<div id="pool"></div>

<button id="infoBtn" class="corner" aria-label="給爸媽">給爸媽</button>
<button id="homeBtn" class="corner" aria-label="回大廳">🏠 大廳</button>
<button id="soundBtn" class="corner" aria-label="聲音">🔊</button>

<header>
  <div class="face" id="face"><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div>
  <div class="sub">點點水面，會有聲音喔 🎵<br>上面高、下面低，畫一畫就是一首歌</div>
</header>

<div id="parent" class="overlay hide">
  <div class="panel">
    <h2>給爸媽的小紙條</h2>
    <p>這裡<b>沒有對錯</b>，用的是五聲音階，怎麼點都好聽。</p>
    <p>讓他<b>自由地點、畫</b>，這正是創造力的開始。你哼一段、請他畫出來，也很好玩。</p>
    <p>累了或心情亂了，就從「🏠 大廳」牽到「靜水」，讓漣漣陪他靜一靜。</p>
    <p style="font-size:clamp(13px,2vmin,22px);color:#85a0bb">沒有聲音的話：把 iPad 側邊靜音鍵關掉、音量調大就好。</p>
    <button class="obtn ghost" id="parentClose">我知道了</button>
  </div>
</div>

<div id="exit" class="overlay hide">
  <div class="lead">要去哪裡呢？</div>
  <div class="otext" style="margin-bottom:6px">自己選一扇門</div>
  <button class="obtn" id="goHub">回大廳</button>
  <button class="obtn ghost" id="goLian">回漣心</button>
  <button class="obtn small" id="goBack">繼續玩</button>
</div>

<script>
(function(){
  "use strict";
  var SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00,1046.50];
  var HUES=[205,196,150,120,90,60,45,30,20,340,320];
  var ac=null, muted=false, lastT=0;
  var pool=document.getElementById("pool");
  var face=document.getElementById("face"), fT=null;

  function unlock(){ try{ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); } if(ac.state==="suspended"){ ac.resume(); } }catch(e){} }
  function tone(freq){ if(muted) return;
    try{ unlock(); if(!ac) return;
      var t=ac.currentTime, g=ac.createGain(); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
      var o=ac.createOscillator(); o.type="sine"; o.frequency.value=freq; o.connect(g);
      var o2=ac.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2;
      var g2=ac.createGain(); g2.gain.value=0.28; o2.connect(g2); g2.connect(g);
      o.start(t); o2.start(t); o.stop(t+1.55); o2.stop(t+1.55);
    }catch(e){}
  }
  function bounce(){ face.classList.add("bounce"); clearTimeout(fT); fT=setTimeout(function(){ face.classList.remove("bounce"); },160); }

  function idxFromY(y){ var f=1-Math.min(Math.max(y/window.innerHeight,0),1); return Math.round(f*(SCALE.length-1)); }
  function ripple(x,y,hue){
    var r=document.createElement("div"); r.className="ripple";
    r.style.left=x+"px"; r.style.top=y+"px"; r.style.borderColor="hsl("+hue+",70%,60%)";
    pool.appendChild(r);
    r.addEventListener("animationend", function(){ if(r.parentNode) r.parentNode.removeChild(r); });
    setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 1300);
  }
  function play(x,y){
    var now=Date.now(); if(now-lastT<60) return; lastT=now;
    var i=idxFromY(y); tone(SCALE[i]); ripple(x,y,HUES[i]); bounce();
  }

  pool.addEventListener("pointerdown", function(e){ e.preventDefault(); play(e.clientX,e.clientY); });
  pool.addEventListener("pointermove", function(e){ if(e.buttons||e.pressure>0){ e.preventDefault(); play(e.clientX,e.clientY); } });

  function show(id){ document.getElementById(id).classList.remove("hide"); }
  function hide(id){ document.getElementById(id).classList.add("hide"); }
  document.getElementById("infoBtn").addEventListener("click", function(){ show("parent"); });
  document.getElementById("parentClose").addEventListener("click", function(){ hide("parent"); });
  document.getElementById("homeBtn").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goBack").addEventListener("click", function(){ hide("exit"); });
  document.getElementById("goHub").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goLian").addEventListener("click", function(){ location.href="https://tiny-mooncake-6746bf.netlify.app"; });
  document.getElementById("soundBtn").addEventListener("click", function(){ muted=!muted; document.getElementById("soundBtn").textContent=muted?"🔈":"🔊"; });
})();
</script>
</body>
</html>
