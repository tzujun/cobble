<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漣心 · 動一動</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; position:fixed; inset:0; touch-action:none;
    font-family:"Noto Serif TC",serif; background:#e8f5ee; color:#1f5a3e; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; }

  .corner{ position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30;
    width:clamp(42px,6vmin,72px); height:clamp(42px,6vmin,72px); border-radius:50%; border:none; cursor:pointer;
    background:rgba(54,140,103,0.16); color:#2c7a55; font-size:clamp(14px,2.3vmin,24px);
    display:flex; align-items:center; justify-content:center; line-height:1.05; }
  #infoBtn{ left:max(12px, env(safe-area-inset-left)); }
  #homeBtn{ right:calc(max(12px, env(safe-area-inset-right)) + clamp(42px,6vmin,72px) + 8px);
    width:auto; padding:0 clamp(12px,1.8vmin,20px); gap:5px; font-size:clamp(13px,2.1vmin,22px); white-space:nowrap; }
  #soundBtn{ right:max(12px, env(safe-area-inset-right)); }

  header{ text-align:center; padding:max(14px,env(safe-area-inset-top)) 12px 4px; flex:0 0 auto; }
  .face{ width:clamp(50px,10vmin,110px); height:clamp(50px,10vmin,110px); margin:4px auto; position:relative;
    border-radius:50%; background:radial-gradient(circle at 35% 32%, #fff, #eaf4fb 70%, #bfddf4);
    border:2px solid rgba(111,168,220,0.5); transition:transform .16s ease; }
  .face.bounce{ transform:translateY(-8px) scale(1.06); }
  .face .eye{ position:absolute; top:42%; width:10%; height:14%; border-radius:50%; background:#3a6694; }
  .face .eye.l{ left:32%; } .face .eye.r{ right:32%; }
  .face .mouth{ position:absolute; left:34%; right:34%; top:56%; height:20%; border-bottom:clamp(3px,0.6vmin,6px) solid #3a6694; border-radius:0 0 999px 999px; }
  .face .cheek{ position:absolute; top:52%; width:11%; height:8%; border-radius:50%; background:rgba(247,168,170,.5); }
  .face .cheek.l{ left:20%; } .face .cheek.r{ right:20%; }
  h1{ font-size:clamp(20px,3.6vmin,40px); font-weight:500; }
  .sub{ font-size:clamp(13px,2.2vmin,24px); color:#4f7d66; margin-top:2px; }

  /* 路徑 */
  #track{ position:relative; flex:1 1 auto; margin:clamp(10px,2vmin,26px) clamp(14px,3vmin,40px); min-height:0; }
  .line{ position:absolute; left:2%; right:2%; top:60%; height:clamp(8px,1.4vmin,16px); background:rgba(111,168,220,0.4); border-radius:999px; }
  .lineDone{ position:absolute; left:2%; top:60%; height:clamp(8px,1.4vmin,16px); background:rgba(54,160,107,0.6); border-radius:999px; width:2%; transition:width .5s ease; }
  .stones{ position:absolute; left:0; right:0; top:60%; transform:translateY(-50%); display:flex; }
  .stone{ flex:1; display:flex; justify-content:center; }
  .stone .c{ width:clamp(34px,6vmin,70px); height:clamp(34px,6vmin,70px); border-radius:50%;
    background:#eef6f1; border:2px solid rgba(54,140,103,0.35); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:clamp(15px,2.6vmin,28px); color:#9bbfae; }
  .stone.done .c{ background:#8fd3ad; color:#2c7a55; }
  .stone.finish .c{ background:#ffe9a6; border-color:#e6b800; }
  #drop{ position:absolute; top:calc(60% - clamp(60px,11vmin,120px)); left:0; transform:translateX(-50%);
    font-size:clamp(40px,8vmin,90px); transition:left .5s cubic-bezier(.34,1.56,.64,1); filter:drop-shadow(0 6px 10px rgba(78,134,190,.4)); }
  #drop.hop{ animation:hop .5s ease; }
  @keyframes hop{ 50%{ transform:translateX(-50%) translateY(-26px); } }

  /* 動作卡 */
  #card{ flex:0 0 auto; padding:clamp(16px,2.5vmin,32px) 22px max(22px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.96) 26%); text-align:center;
    transition:transform .3s ease, opacity .3s ease; }
  #card.hide{ transform:translateY(120%); opacity:0; pointer-events:none; }
  #cardEmoji{ font-size:clamp(40px,8vmin,88px); line-height:1; }
  #cardText{ font-size:clamp(22px,4.6vmin,52px); font-weight:700; color:#1f5a3e; margin:6px 0 4px; }
  #cardSub{ font-size:clamp(13px,2.1vmin,24px); color:#5a8a72; margin-bottom:clamp(12px,2vmin,22px); }
  #doneBtn{ padding:clamp(14px,2.2vmin,30px) clamp(44px,6.5vmin,100px); border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:clamp(22px,3.6vmin,46px); font-weight:700; color:#fff; background:#36a06b; box-shadow:0 10px 24px rgba(54,160,107,0.45); }
  #doneBtn:active{ transform:scale(0.95); }

  .overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(28px,4vmin,64px); color:#1f5a3e;
    background:radial-gradient(circle at 50% 36%, rgba(255,255,255,0.92), rgba(206,238,222,0.97)); transition:opacity .5s ease; }
  .overlay.hide{ opacity:0; pointer-events:none; }
  .hero{ font-size:clamp(52px,12vmin,150px); margin-bottom:10px; filter:drop-shadow(0 8px 20px rgba(54,140,103,0.35)); }
  .lead{ font-size:clamp(24px,5.4vmin,60px); font-weight:500; line-height:1.5; margin-bottom:12px; }
  .otext{ font-size:clamp(15px,3vmin,28px); color:#4f7d66; line-height:1.9; max-width:22em; }
  .obtn{ margin-top:22px; padding:clamp(14px,2vmin,26px) clamp(44px,6.5vmin,100px); border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:clamp(20px,3.4vmin,44px); font-weight:500; color:#fff; background:#36a06b; box-shadow:0 10px 26px rgba(54,160,107,0.4); }
  .obtn.ghost{ background:transparent; color:inherit; border:2px solid currentColor; box-shadow:none; margin-top:14px; }
  .obtn.small{ background:transparent; color:inherit; border:none; box-shadow:none; opacity:.7; margin-top:4px; font-size:clamp(16px,2.4vmin,28px); }
  #parent .panel{ max-width:32em; text-align:left; background:rgba(255,255,255,0.92); border:1px solid rgba(54,140,103,0.2);
    border-radius:22px; padding:clamp(26px,3vmin,40px) clamp(24px,3vmin,38px); }
  #parent h2{ font-size:clamp(22px,3.4vmin,40px); font-weight:700; margin-bottom:6px; }
  #parent p{ font-size:clamp(15.5px,2.4vmin,28px); line-height:1.9; color:#3c6651; margin-bottom:12px; }
  #parent p b{ color:#2c7a55; }
</style>
</head>
<body>
<script>
window.onerror=function(msg,src,line){ try{ var d=document.getElementById('__err');
  if(!d){ d=document.createElement('div'); d.id='__err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;font:14px/1.6 -apple-system,sans-serif;padding:12px;white-space:pre-wrap';
    (document.body||document.documentElement).appendChild(d); }
  d.textContent='\u26a0 \u7a0b\u5f0f\u932f\u8aa4\uff1a'+msg+'\u3000(\u884c '+line+')'; }catch(e){} return false; };
</script>

<button id="infoBtn" class="corner" aria-label="給爸媽">給<br>爸媽</button>
<button id="homeBtn" class="corner" aria-label="回大廳">🏠 大廳</button>
<button id="soundBtn" class="corner" aria-label="聲音">🔊</button>

<header>
  <div class="face" id="face"><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div>
  <h1>動一動</h1>
  <div class="sub">和漣漣一起，動一動、跑到終點 🏃</div>
</header>

<div id="track">
  <div class="line"></div>
  <div class="lineDone" id="lineDone"></div>
  <div class="stones" id="stones"></div>
  <div id="drop">💧</div>
</div>

<div id="card" class="hide">
  <div id="cardEmoji">🦘</div>
  <div id="cardText">跳高高，跳五下！</div>
  <div id="cardSub">做完了，就拍一下 👇</div>
  <button id="doneBtn">我做到了！</button>
</div>

<div id="intro" class="overlay">
  <div class="hero">🏃</div>
  <div class="lead">和漣漣一起<br>去路跑！</div>
  <div class="otext">每過一關就動一動身體，<br>動完拍一下，漣漣就往前跳。<br>我們一起跑到終點！</div>
  <button class="obtn" id="startBtn">出發！</button>
</div>

<div id="finish" class="overlay hide">
  <div class="hero">🏁</div>
  <div class="lead">我們一起<br>到終點了！</div>
  <div class="otext">漣漣好開心。<br>十一月路跑，你一定也可以！</div>
  <button class="obtn" id="againBtn">再跑一次</button>
  <button class="obtn ghost" id="againHub">回大廳</button>
</div>

<div id="parent" class="overlay hide">
  <div class="panel">
    <h2>給爸媽的小紙條</h2>
    <p>重點是<b>真的動到身體</b>，不是盯著螢幕。螢幕只負責出題、幫忙慶祝。</p>
    <p>請<b>陪他一起做</b>每個動作——你做，他更願意做，還能順便一起運動。</p>
    <p>沒有快慢、沒有輸贏，終點是<b>「我們一起到了」</b>。這套從暖身到收操，正好替十一月路跑做準備。</p>
    <button class="obtn ghost" id="parentClose">我知道了</button>
  </div>
</div>

<div id="exit" class="overlay hide">
  <div class="lead">要去哪裡呢？</div>
  <div class="otext" style="margin-bottom:6px">自己選一扇門</div>
  <button class="obtn" id="goHub">回大廳</button>
  <button class="obtn ghost" id="goLian">回漣心</button>
  <button class="obtn small" id="goBack">繼續玩</button>
</div>

<script>
(function(){
  "use strict";
  var STAGES=[
    {e:"🦘",t:"跳高高，跳五下！",v:"跳高高，跳五下"},
    {e:"🐸",t:"學青蛙，蹲跳五下！",v:"學青蛙，蹲跳五下"},
    {e:"🏊",t:"大大的划水手，划十下！",v:"大大的划水手，划十下"},
    {e:"🛴",t:"站滑板車，單腳站十秒！",v:"站滑板車，單腳站十秒"},
    {e:"🏃",t:"原地跑步，數到二十！",v:"原地跑步，數到二十"},
    {e:"🌬️",t:"慢慢深呼吸，三次。",v:"跑完囉，和漣漣慢慢深呼吸三次"}
  ];
  var N=STAGES.length, NS=N+1; // 石頭數
  var cur=0, busy=false;

  // 音訊（鋼琴那套穩定寫法）
  var ac=null, muted=false;
  function tone(freq,dur){ if(muted) return;
    try{ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); }
      if(ac.state==="suspended"){ ac.resume(); }
      var t=ac.currentTime, g=ac.createGain(); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.5));
      var o=ac.createOscillator(); o.type="sine"; o.frequency.value=freq; o.connect(g);
      o.start(t); o.stop(t+(dur||0.5)+0.05);
    }catch(e){}
  }
  function ding(){ [523.25,659.25,783.99].forEach(function(f,i){ setTimeout(function(){ tone(f,0.5); }, i*90); }); }
  function say(txt){ if(muted) return; try{ if("speechSynthesis" in window){ speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt); u.lang="zh-TW"; u.rate=1.0; u.pitch=1.1; speechSynthesis.speak(u);} }catch(e){} }

  var face=document.getElementById("face"), fT=null;
  function bounce(){ face.classList.add("bounce"); clearTimeout(fT); fT=setTimeout(function(){ face.classList.remove("bounce"); },160); }

  // 建立石頭
  var stonesEl=document.getElementById("stones");
  for(var i=0;i<NS;i++){
    var s=document.createElement("div"); s.className="stone"+(i===NS-1?" finish":"");
    var c=document.createElement("div"); c.className="c";
    c.textContent = (i===NS-1) ? "🏁" : String(i+1);
    s.appendChild(c); stonesEl.appendChild(s);
  }
  var stones=stonesEl.children;
  var drop=document.getElementById("drop");
  function stoneCenter(i){ return ((i+0.5)/NS*100); }
  function placeDrop(i){ drop.style.left=stoneCenter(i)+"%"; }
  placeDrop(0);

  var card=document.getElementById("card");
  var cheers=["好棒","跳得真好","你好厲害","再往前一點點","漣漣好開心"];

  function showCard(){
    var st=STAGES[cur];
    document.getElementById("cardEmoji").textContent=st.e;
    document.getElementById("cardText").textContent=st.t;
    card.classList.remove("hide");
    say(st.v);
  }
  function doneStage(){
    if(busy || cur>=N) return;
    busy=true;
    card.classList.add("hide");
    ding(); bounce(); say(cheers[Math.floor(Math.random()*cheers.length)]);
    stones[cur].classList.add("done");
    cur++;
    placeDrop(cur);
    drop.classList.remove("hop"); void drop.offsetWidth; drop.classList.add("hop");
    document.getElementById("lineDone").style.width = (cur/(NS-1)* (96) +2) + "%";
    setTimeout(function(){
      busy=false;
      if(cur>=N){ finishGame(); } else { showCard(); }
    }, 560);
  }
  function finishGame(){
    say("漣漣，我們一起到終點了，你好棒");
    document.getElementById("finish").classList.remove("hide");
  }

  function unlock(){ try{ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); }
    if(ac.state==="suspended"){ ac.resume(); } }catch(e){} }
  function startGame(){
    unlock();
    cur=0; busy=false;
    for(var i=0;i<stones.length;i++){ stones[i].classList.remove("done"); }
    placeDrop(0); document.getElementById("lineDone").style.width="2%";
    document.getElementById("intro").classList.add("hide");
    document.getElementById("finish").classList.add("hide");
    setTimeout(showCard, 400);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("doneBtn").addEventListener("click", doneStage);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("againHub").addEventListener("click", function(){ location.href="index.html"; });

  function show(id){ document.getElementById(id).classList.remove("hide"); }
  function hide(id){ document.getElementById(id).classList.add("hide"); }
  document.getElementById("infoBtn").addEventListener("click", function(){ show("parent"); });
  document.getElementById("parentClose").addEventListener("click", function(){ hide("parent"); });
  document.getElementById("homeBtn").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goBack").addEventListener("click", function(){ hide("exit"); });
  document.getElementById("goHub").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goLian").addEventListener("click", function(){ location.href="https://tiny-mooncake-6746bf.netlify.app"; });
  document.getElementById("soundBtn").addEventListener("click", function(){ muted=!muted; document.getElementById("soundBtn").textContent=muted?"🔈":"🔊"; });

  document.addEventListener("keydown", function(e){
    if(e.key!=="Enter"&&e.key!==" ") return; e.preventDefault();
    if(!document.getElementById("intro").classList.contains("hide")) startGame();
    else if(!document.getElementById("finish").classList.contains("hide")) startGame();
    else if(!card.classList.contains("hide")) doneStage();
  });
})();
</script>
</body>
</html>
