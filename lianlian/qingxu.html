<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漣心 · 情緒小劇場</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; position:fixed; inset:0; touch-action:none;
    font-family:"Noto Serif TC",serif; background:#fff7ee; color:#5a4632; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; align-items:center; }

  .corner{ position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30;
    height:clamp(42px,6vmin,72px); border-radius:999px; border:none; cursor:pointer;
    background:rgba(214,158,96,0.18); color:#a5702c; font-size:clamp(14px,2.3vmin,24px);
    display:flex; align-items:center; justify-content:center; line-height:1.05; }
  #infoBtn{ left:max(12px, env(safe-area-inset-left)); width:clamp(42px,6vmin,72px); }
  #soundBtn{ right:max(12px, env(safe-area-inset-right)); width:clamp(42px,6vmin,72px); }
  #homeBtn{ right:calc(max(12px, env(safe-area-inset-right)) + clamp(42px,6vmin,72px) + 8px);
    padding:0 clamp(12px,1.8vmin,20px); gap:5px; font-size:clamp(13px,2.1vmin,22px); white-space:nowrap; }

  header{ text-align:center; padding:max(14px,env(safe-area-inset-top)) 12px 0; flex:0 0 auto; }
  h1{ font-size:clamp(20px,3.6vmin,40px); font-weight:500; color:#a5702c; }

  #stage{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; padding:6px 16px; min-height:0; }
  #faceWrap{ width:clamp(150px,34vmin,340px); height:clamp(150px,34vmin,340px); transition:transform .2s ease; }
  #faceWrap.happy{ animation:bob .6s ease infinite; }
  #faceWrap.cry{ animation:tremble .18s linear infinite; }
  #faceWrap.fuss{ animation:shake .12s linear infinite; }
  #faceWrap.stub{ transform:rotate(-6deg); }
  #faceWrap.good{ animation:sway 2s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateY(-10px);} }
  @keyframes tremble{ 25%{transform:translate(-2px,1px);}75%{transform:translate(2px,-1px);} }
  @keyframes shake{ 25%{transform:translate(-4px,0) rotate(-2deg);}75%{transform:translate(4px,0) rotate(2deg);} }
  @keyframes sway{ 50%{ transform:rotate(4deg);} }

  #scene{ font-size:clamp(17px,3vmin,30px); font-weight:700; color:#7a5a34; text-align:center; margin-top:clamp(8px,1.6vmin,18px); min-height:1.5em; max-width:22em; }
  #tip{ font-size:clamp(14px,2.3vmin,25px); color:#6a7d5a; background:rgba(120,160,90,0.12); border-radius:16px;
    padding:clamp(10px,1.6vmin,18px) clamp(16px,2.4vmin,28px); margin-top:clamp(8px,1.4vmin,16px); text-align:left; line-height:1.8; max-width:24em; min-height:2em; }
  #tip b{ color:#4f7a3a; }

  #btns{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:clamp(8px,1.4vmin,14px); justify-content:center;
    padding:clamp(10px,2vmin,22px) 14px max(20px,env(safe-area-inset-bottom)); }
  .emo{ border:none; border-radius:999px; cursor:pointer; font-family:inherit; font-weight:700; color:#fff;
    font-size:clamp(17px,2.8vmin,30px); padding:clamp(12px,1.8vmin,22px) clamp(18px,2.6vmin,34px);
    box-shadow:0 6px 0 rgba(0,0,0,0.10), 0 8px 16px rgba(0,0,0,0.12); transition:transform .08s ease, box-shadow .08s ease; }
  .emo:active,.emo.on{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.10); }

  .overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(28px,4vmin,64px); color:#5a4632;
    background:radial-gradient(circle at 50% 36%, rgba(255,255,255,0.94), rgba(250,235,215,0.97)); transition:opacity .5s ease; }
  .overlay.hide{ opacity:0; pointer-events:none; }
  .obtn.ghost{ margin-top:8px; padding:clamp(12px,1.8vmin,22px) clamp(34px,4vmin,60px); border-radius:999px; border:2px solid #d69e60;
    background:transparent; color:#a5702c; font-family:inherit; font-size:clamp(16px,2.4vmin,30px); cursor:pointer; }
  #parent .panel{ max-width:32em; text-align:left; background:rgba(255,255,255,0.94); border:1px solid rgba(214,158,96,0.3);
    border-radius:22px; padding:clamp(26px,3vmin,40px) clamp(24px,3vmin,38px); }
  #parent h2{ font-size:clamp(22px,3.4vmin,40px); font-weight:700; color:#a5702c; margin-bottom:8px; }
  #parent p{ font-size:clamp(15.5px,2.4vmin,28px); line-height:1.9; color:#6a5540; margin-bottom:12px; }
  #parent p b{ color:#a5702c; }
</style>
</head>

<script>
window.onerror=function(msg,src,line){ try{ var d=document.getElementById('__err');
  if(!d){ d=document.createElement('div'); d.id='__err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;font:14px/1.6 -apple-system,sans-serif;padding:12px;white-space:pre-wrap';
    (document.body||document.documentElement).appendChild(d); }
  d.textContent='\u26a0 \u7a0b\u5f0f\u932f\u8aa4\uff1a'+msg+'\u3000(\u884c '+line+')'; }catch(e){} return false; };

<button id="infoBtn" class="corner" aria-label="給爸媽">給爸媽</button>
<button id="homeBtn" class="corner" aria-label="回大廳">🏠 大廳</button>
<button id="soundBtn" class="corner" aria-label="聲音">🔊</button>

<header><h1>情緒小劇場</h1></header>

<div id="stage">
  <div id="faceWrap"></div>
  <div id="scene">點下面看看，四歲的心情長什麼樣子？</div>
  <div id="tip">這是給大人的小工具：先懂孩子的情緒，再回應。也可以和孩子一起玩，問他「你現在是哪一個？」</div>
</div>

<div id="btns"></div>

<div id="parent" class="overlay hide">
  <div class="panel">
    <h2>給爸媽的小紙條</h2>
    <p>點一種情緒，就會看到四歲孩子<b>可能的表情、聲音</b>，還有一句<b>可以怎麼回應</b>。</p>
    <p>用法一:陪伴前先看看，提醒自己「先接住情緒，再講道理」。</p>
    <p>用法二:和孩子一起玩，問他<b>「你現在是哪一個表情?」</b>——幫他認識、說出自己的情緒。</p>
    <p>沒有哪個情緒是「壞」的。哭、鬧、拗，都是他在長大。我們的功課是陪他一起認識它們。</p>
    <button class="obtn ghost" id="parentClose">我知道了</button>
  </div>
</div>

  Object.keys(CLIPS).forEach(function(k){ CLIPS[k].preload="auto"; });
  function playSound(kind){
    if(curAudio){ try{ curAudio.pause(); curAudio.currentTime=0; }catch(e){} curAudio=null; }
    if(muted) return;
    var c=CLIPS[kind];
    if(c){ try{ c.currentTime=0; var p=c.play(); if(p&&p.catch)p.catch(function(){}); curAudio=c; }catch(e){} }
  }

  function playEmo(key,btn){
    var e=EMO[key]; if(!e) return;
    faceWrap.className=""; void faceWrap.offsetWidth; faceWrap.className=e.cls;
    faceWrap.innerHTML=svg(e.face);
    scene.textContent=e.scene; tip.innerHTML=e.tip;
    playSound(e.sound);
    var all=document.querySelectorAll(".emo"); for(var i=0;i<all.length;i++) all[i].classList.remove("on");
    if(btn) btn.classList.add("on");
  }

  var btns=document.getElementById("btns");
  ORDER.forEach(function(key){
    var e=EMO[key];
    var b=document.createElement("button"); b.className="emo"; b.style.background=e.color;
    b.textContent=e.label;
    b.addEventListener("pointerdown", function(ev){ ev.preventDefault(); playEmo(key,b); });
    btns.appendChild(b);
  });

  document.getElementById("infoBtn").addEventListener("click", function(){ document.getElementById("parent").classList.remove("hide"); });
  document.getElementById("parentClose").addEventListener("click", function(){ document.getElementById("parent").classList.add("hide"); });
  document.getElementById("homeBtn").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("soundBtn").addEventListener("click", function(){ muted=!muted; if(muted&&curAudio){ try{curAudio.pause();}catch(e){} } document.getElementById("soundBtn").textContent=muted?"🔈":"🔊"; });
})();
