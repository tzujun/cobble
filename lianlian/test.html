<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漣漣 · 測試頁</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,"PingFang TC","Heiti TC",sans-serif; background:#eaf4fb; color:#27486b;
    text-align:center; padding:24px; -webkit-user-select:none; user-select:none; }
  h1{ font-size:26px; margin-bottom:6px; }
  .hint{ font-size:17px; color:#5a7795; line-height:1.8; max-width:18em; margin-bottom:10px; }
  .big{ font-size:80px; font-weight:800; color:#4E86BE; margin:6px 0; }
  button{ font-size:30px; font-weight:700; padding:26px 60px; border:none; border-radius:999px;
    background:#4E86BE; color:#fff; box-shadow:0 10px 26px rgba(78,134,190,0.4); cursor:pointer; margin:14px 0 18px; }
  button:active{ transform:scale(0.95); }
  .stat{ font-size:16px; color:#5a7795; line-height:1.9; max-width:22em; }
  .ok{ color:#36a06b; font-weight:700; }
</style>
</head>
<body>
  <h1>漣漣 · 測試頁</h1>
  <div class="hint">點下面這顆藍色大按鈕幾下，<br>看數字會不會跳、有沒有「嗶」一聲。</div>
  <div class="big" id="count">0</div>
  <button id="btn">👆 點 我</button>
  <div class="stat" id="audio">聲音：還沒開始</div>
  <div class="stat" id="info">　</div>
<script>
(function(){
  var n=0, ac=null;
  var count=document.getElementById('count');
  var audio=document.getElementById('audio');
  var info=document.getElementById('info');
  var btn=document.getElementById('btn');

  try{
    var ua=navigator.userAgent;
    info.textContent='畫面有跑到這裡 ✓　（'+(/iPad|iPhone|iPod/.test(ua)?'iOS':'其他')+'）';
  }catch(e){}

  function beep(){
    try{
      if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); }
      if(ac.state==='suspended'){ ac.resume(); }
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=660; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.4);
      o.start(); o.stop(ac.currentTime+0.45);
      audio.innerHTML='聲音：<span class="ok">已啟動（'+ac.state+'）</span> — 有聽到嗶聲嗎？';
    }catch(e){ audio.textContent='聲音：失敗（'+e.message+'）'; }
  }
  function tap(){ n++; count.textContent=n; beep(); }

  btn.addEventListener('click', tap);
})();
</script>
</body>
</html>
