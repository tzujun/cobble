<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漣心 · 漣漣的鋼琴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; position:fixed; inset:0;
    font-family:"Noto Serif TC",serif; background:#eef6fb; color:#27486b;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none; touch-action:none; }
  body{ display:flex; flex-direction:column; }

  .corner{ position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30;
    width:clamp(42px,6vmin,72px); height:clamp(42px,6vmin,72px); border-radius:50%; border:none; cursor:pointer;
    background:rgba(78,134,190,0.14); color:#3a6694; font-size:clamp(14px,2.3vmin,24px);
    display:flex; align-items:center; justify-content:center; line-height:1.05; }
  #infoBtn{ left:max(12px, env(safe-area-inset-left)); }
  #homeBtn{ right:calc(max(12px, env(safe-area-inset-right)) + clamp(42px,6vmin,72px) + 8px);
    width:auto; padding:0 clamp(12px,1.8vmin,20px); gap:5px; font-size:clamp(13px,2.1vmin,22px); white-space:nowrap; }
  #soundBtn{ right:max(12px, env(safe-area-inset-right)); }

  header{ text-align:center; padding:max(12px,env(safe-area-inset-top)) 12px 2px; flex:0 0 auto; }
  .face{ width:clamp(48px,9vmin,100px); height:clamp(48px,9vmin,100px); margin:2px auto; position:relative;
    border-radius:50%; background:radial-gradient(circle at 35% 32%, #fff, #eaf4fb 70%, #bfddf4);
    border:2px solid rgba(111,168,220,0.5); transition:transform .16s ease; }
  .face.bounce{ transform:translateY(-8px) scale(1.06); }
  .face .eye{ position:absolute; top:42%; width:10%; height:14%; border-radius:50%; background:#3a6694; }
  .face .eye.l{ left:32%; } .face .eye.r{ right:32%; }
  .face .mouth{ position:absolute; left:34%; right:34%; top:56%; height:20%;
    border-bottom:clamp(3px,0.6vmin,6px) solid #3a6694; border-radius:0 0 999px 999px; }
  .face .cheek{ position:absolute; top:52%; width:11%; height:8%; border-radius:50%; background:rgba(247,168,170,.5); }
  .face .cheek.l{ left:20%; } .face .cheek.r{ right:20%; }
  h1{ font-size:clamp(18px,3.2vmin,36px); font-weight:500; }
  .sub{ font-size:clamp(12px,2vmin,22px); color:#5a7795; margin-top:1px; }

  #piano{ position:relative; flex:1.15 1 0; margin:2px clamp(8px,1.6vmin,20px) 0; display:flex; touch-action:none; }
  .wkey{ flex:1 1 0; background:linear-gradient(#ffffff,#f2f6fb); border:1px solid #cfdae6; border-top:none;
    border-radius:0 0 clamp(6px,1vmin,12px) clamp(6px,1vmin,12px); position:relative; z-index:1; cursor:pointer;
    box-shadow:inset 0 -6px 8px rgba(0,0,0,0.05); }
  .wkey:active,.wkey.on{ background:linear-gradient(#e6eef8,#d7e4f2); }
  .bkey{ position:absolute; top:0; height:62%; width:4.0%; transform:translateX(-50%); z-index:2; cursor:pointer;
    background:linear-gradient(#42536b,#1d2a3d); border:1px solid #10192a;
    border-radius:0 0 clamp(4px,0.8vmin,8px) clamp(4px,0.8vmin,8px); box-shadow:0 4px 6px rgba(0,0,0,0.35); }
  .bkey:active,.bkey.on{ background:linear-gradient(#6a7d97,#3a4a60); }

  .hands{ text-align:center; font-size:clamp(12px,1.9vmin,20px); color:#6FA8DC; padding:6px 0 2px; flex:0 0 auto; }

  #pads{ flex:1 1 0; display:flex; gap:clamp(5px,1vmin,12px); padding:2px clamp(8px,1.6vmin,20px) clamp(10px,2vmin,22px); }
  .pad{ flex:1 1 0; border:none; border-radius:clamp(12px,1.8vmin,24px); cursor:pointer; position:relative;
    box-shadow:0 7px 0 rgba(0,0,0,0.10), 0 10px 20px rgba(0,0,0,0.12); transition:transform .06s ease, box-shadow .06s ease;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:clamp(8px,1.4vmin,18px); }
  .pad:active,.pad.on{ transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,0.10), 0 3px 8px rgba(0,0,0,0.12); }
  .pad .dot{ font-size:clamp(18px,3.4vmin,40px); opacity:.9; }

  .overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(28px,4vmin,64px); color:#27486b;
    background:radial-gradient(circle at 50% 36%, rgba(255,255,255,0.93), rgba(210,232,247,0.97)); transition:opacity .5s ease; }
  .overlay.hide{ opacity:0; pointer-events:none; }
  .lead{ font-size:clamp(24px,5.4vmin,56px); font-weight:500; line-height:1.5; margin-bottom:12px; }
  .otext{ font-size:clamp(15px,3vmin,28px); color:#5a7795; line-height:1.9; max-width:22em; }
  .obtn{ margin-top:22px; padding:clamp(14px,2vmin,26px) clamp(44px,6.5vmin,100px); border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:clamp(20px,3.4vmin,44px); font-weight:500; color:#fff; background:#4E86BE; box-shadow:0 10px 26px rgba(78,134,190,0.4); }
  .obtn.ghost{ background:transparent; color:inherit; border:2px solid currentColor; box-shadow:none; margin-top:14px; }
  .obtn.small{ background:transparent; color:inherit; border:none; box-shadow:none; opacity:.7; margin-top:4px; font-size:clamp(16px,2.4vmin,28px); }
  #parent .panel{ max-width:32em; text-align:left; background:rgba(255,255,255,0.92); border:1px solid rgba(78,134,190,0.2);
    border-radius:22px; padding:clamp(26px,3vmin,40px) clamp(24px,3vmin,38px); }
  #parent h2{ font-size:clamp(22px,3.4vmin,40px); font-weight:700; margin-bottom:8px; }
  #parent p{ font-size:clamp(15.5px,2.4vmin,28px); line-height:1.9; color:#43617f; margin-bottom:12px; }
  #parent p b{ color:#2f6394; }
</style>
</head>
<body>
<script>
window.onerror=function(msg,src,line){ try{ var d=document.getElementById('__err');
  if(!d){ d=document.createElement('div'); d.id='__err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;font:14px/1.6 -apple-system,sans-serif;padding:12px;white-space:pre-wrap';
    (document.body||document.documentElement).appendChild(d); }
  d.textContent='\u26a0 \u7a0b\u5f0f\u932f\u8aa4\uff1a'+msg+'\u3000(\u884c '+line+')'; }catch(e){} return false; };
</script>

<button id="infoBtn" class="corner" aria-label="給爸媽">給<br>爸媽</button>
<button id="homeBtn" class="corner" aria-label="回大廳">🏠 大廳</button>
<button id="soundBtn" class="corner" aria-label="聲音">🔊</button>

<header>
  <div class="face" id="face">
    <div class="eye l"></div><div class="eye r"></div>
    <div class="cheek l"></div><div class="cheek r"></div>
    <div class="mouth"></div>
  </div>
  <h1>漣漣的鋼琴</h1>
  <div class="sub">上面是真的鋼琴，下面怎麼彈都好聽 🎹</div>
</header>

<div id="piano"></div>
<div class="hands">🙌 兩隻手一起彈彈看</div>
<div id="pads"></div>

<div id="parent" class="overlay hide">
  <div class="panel">
    <h2>給爸媽的小紙條</h2>
    <p><b>上排</b>是真正的黑白鋼琴鍵——讓他認得鋼琴的樣子，試著用兩隻手。</p>
    <p><b>下排</b>是五聲音階，<b>怎麼彈都好聽</b>；想自由發揮、不怕彈錯，就往下彈。</p>
    <p>沒有對錯、沒有輸贏。你彈一句、他接一句，就是最好的音樂課。</p>
    <p style="font-size:clamp(13px,2vmin,22px);color:#85a0bb">沒有聲音的話：把 iPad 側邊靜音鍵關掉、音量調大就好。</p>
    <button class="obtn ghost" id="parentClose">我知道了</button>
  </div>
</div>

<div id="exit" class="overlay hide">
  <div class="lead">要去哪裡呢？</div>
  <div class="otext" style="margin-bottom:6px">自己選一扇門</div>
  <button class="obtn" id="goHub">回大廳</button>
  <button class="obtn ghost" id="goLian">回漣心</button>
  <button class="obtn small" id="goBack">繼續玩</button>
</div>

<script>
(function(){
  "use strict";
  var ac=null, muted=false;
  function tone(freq){
    if(muted) return;
    try{
      if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); }
      if(ac.state==="suspended"){ ac.resume(); }
      var t=ac.currentTime;
      var g=ac.createGain(); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
      var o=ac.createOscillator(); o.type="triangle"; o.frequency.value=freq; o.connect(g);
      var o2=ac.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2;
      var g2=ac.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(g);
      o.start(t); o2.start(t); o.stop(t+1.3); o2.stop(t+1.3);
    }catch(e){}
  }
  var face=document.getElementById("face"), fT=null;
  function bounce(){ face.classList.add("bounce"); clearTimeout(fT); fT=setTimeout(function(){ face.classList.remove("bounce"); },150); }
  function press(el){ el.classList.add("on"); setTimeout(function(){ el.classList.remove("on"); },120); }
  function hit(el,freq){ tone(freq); bounce(); press(el); }

  var WHITE=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,
             523.25,587.33,659.25,698.46,783.99,880.00,987.77,1046.50];
  var NW=WHITE.length;
  var BLACK=[ {a:0,f:277.18},{a:1,f:311.13},{a:3,f:369.99},{a:4,f:415.30},{a:5,f:466.16},
              {a:7,f:554.37},{a:8,f:622.25},{a:10,f:739.99},{a:11,f:830.61},{a:12,f:932.33} ];
  var piano=document.getElementById("piano");
  WHITE.forEach(function(f){
    var k=document.createElement("div"); k.className="wkey";
    k.addEventListener("pointerdown", function(e){ e.preventDefault(); hit(k,f); });
    piano.appendChild(k);
  });
  BLACK.forEach(function(b){
    var k=document.createElement("div"); k.className="bkey";
    k.style.left=(((b.a+1)/NW)*100)+"%";
    k.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); hit(k,b.f); });
    piano.appendChild(k);
  });

  var PADS=[
    {f:261.63,c:"#ef8a7f",d:"🍓"},{f:293.66,c:"#f3a75e",d:"🍊"},{f:329.63,c:"#f2cd60",d:"🍋"},
    {f:392.00,c:"#8ed08a",d:"🥝"},{f:440.00,c:"#6fc3d0",d:"🫐"},{f:523.25,c:"#7f9fd8",d:"💧"},
    {f:587.33,c:"#a98fd0",d:"🍇"},{f:659.25,c:"#e78fb5",d:"🌸"}
  ];
  function shade(hex){ try{ var n=parseInt(hex.slice(1),16); return "rgb("+Math.round(((n>>16)&255)*0.82)+","+Math.round(((n>>8)&255)*0.82)+","+Math.round((n&255)*0.82)+")"; }catch(e){ return hex; } }
  var pads=document.getElementById("pads");
  PADS.forEach(function(p){
    var b=document.createElement("button"); b.className="pad";
    b.style.background="linear-gradient(180deg,"+p.c+","+shade(p.c)+")";
    b.innerHTML='<span class="dot">'+p.d+'</span>';
    b.addEventListener("pointerdown", function(e){ e.preventDefault(); hit(b,p.f); });
    pads.appendChild(b);
  });

  function show(id){ document.getElementById(id).classList.remove("hide"); }
  function hide(id){ document.getElementById(id).classList.add("hide"); }
  document.getElementById("infoBtn").addEventListener("click", function(){ show("parent"); });
  document.getElementById("parentClose").addEventListener("click", function(){ hide("parent"); });
  document.getElementById("homeBtn").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goBack").addEventListener("click", function(){ hide("exit"); });
  document.getElementById("goHub").addEventListener("click", function(){ location.href="index.html"; });
  document.getElementById("goLian").addEventListener("click", function(){ location.href="https://tiny-mooncake-6746bf.netlify.app"; });
  document.getElementById("soundBtn").addEventListener("click", function(){ muted=!muted; document.getElementById("soundBtn").textContent=muted?"🔈":"🔊"; });
})();
</script>
</body>
</html>
