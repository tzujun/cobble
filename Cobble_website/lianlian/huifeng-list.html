<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漣心 · 回饋觀看</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; font-family:"Noto Serif TC",serif; background:#F7F3EA; color:#27486b; }
  body{ display:flex; flex-direction:column; align-items:center; padding:max(24px,env(safe-area-inset-top)) 16px 40px; }
  .corner{ position:fixed; top:max(12px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); z-index:30;
    height:clamp(42px,6vmin,64px); border-radius:999px; border:none; cursor:pointer; background:rgba(78,134,190,0.14);
    color:#3a6694; font-size:clamp(13px,2.1vmin,20px); display:flex; align-items:center; padding:0 16px; gap:5px; }
  h1{ font-size:clamp(22px,4vmin,38px); font-weight:500; margin:10px 0 4px; text-align:center; }
  .sub{ color:#5a7795; font-size:clamp(14px,2.3vmin,20px); margin-bottom:20px; text-align:center; }

  #gate{ width:100%; max-width:22em; text-align:center; margin-top:12vh; }
  #pass{ width:100%; padding:14px 18px; border:1.5px solid #c3dcf2; border-radius:14px; font-family:inherit; font-size:18px; text-align:center; outline:none; }
  #pass:focus{ border-color:#6FA8DC; }
  .btn{ margin-top:16px; padding:14px 44px; border:none; border-radius:999px; cursor:pointer; font-family:inherit; font-size:18px;
    font-weight:500; color:#fff; background:#4E86BE; box-shadow:0 8px 20px rgba(78,134,190,0.4); }
  .gate-msg{ color:#c0392b; margin-top:10px; min-height:1.3em; font-size:15px; }

  #panel{ display:none; width:100%; max-width:44em; }
  .bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .count{ font-size:clamp(15px,2.4vmin,22px); color:#5a7795; }
  .refresh{ padding:9px 20px; border:1.5px solid #6FA8DC; border-radius:999px; background:#fff; color:#3a6694; font-family:inherit; font-size:15px; cursor:pointer; }
  .item{ background:#fff; border:1px solid rgba(78,134,190,0.16); border-radius:16px; padding:18px 20px; margin-bottom:12px; box-shadow:0 8px 22px rgba(78,134,190,0.08); }
  .item .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .item .stars{ font-size:20px; letter-spacing:2px; }
  .item .fav{ font-size:14px; color:#3a6694; background:rgba(111,168,220,0.14); padding:3px 12px; border-radius:999px; }
  .item .time{ font-size:13px; color:#9aaabe; }
  .item .who{ font-size:14px; color:#7a8aa0; margin-top:6px; }
  .item .comment{ font-size:clamp(15px,2.3vmin,20px); line-height:1.8; color:#2f4d6e; margin-top:8px; white-space:pre-wrap; }
  .empty{ text-align:center; color:#9aaabe; padding:40px 0; }
</style>
</head>
<body>
<a class="corner" href="index.html">🏠 大廳</a>
<h1>家長回饋</h1>
<div class="sub">漣漣的小水滴世界 · 收在漣心自己裡</div>

<div id="gate">
  <input id="pass" type="password" placeholder="請輸入密碼" />
  <div><button class="btn" id="enter">進入</button></div>
  <div class="gate-msg" id="gmsg"></div>
</div>

<div id="panel">
  <div class="bar">
    <div class="count" id="count">讀取中…</div>
    <button class="refresh" id="refresh">重新整理</button>
  </div>
  <div id="list"></div>
</div>

<script>
(function(){
  "use strict";
  // ⬇⬇ 和回饋頁同一個 Firebase 網址（我拿到後會一起填好）⬇⬇
  var DB_URL = "https://tzujun-5a91d-default-rtdb.asia-southeast1.firebasedatabase.app";
  var PASSCODE = "Tzujun0618";

  var gate=document.getElementById("gate"), panel=document.getElementById("panel");
  var pass=document.getElementById("pass"), gmsg=document.getElementById("gmsg");

  function enter(){
    if(pass.value.trim()!==PASSCODE){ gmsg.textContent="密碼不對，再試一次"; return; }
    gate.style.display="none"; panel.style.display="block"; load();
  }
  document.getElementById("enter").addEventListener("click", enter);
  pass.addEventListener("keydown", function(e){ if(e.key==="Enter") enter(); });
  document.getElementById("refresh").addEventListener("click", load);

  function stars(n){ n=parseInt(n,10)||0; var s=""; for(var i=0;i<5;i++) s+= (i<n?"⭐":"☆"); return s; }
  function esc(t){ return String(t==null?"":t).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function load(){
    var count=document.getElementById("count"), list=document.getElementById("list");
    if(DB_URL.indexOf("firebase")<0){ count.textContent=""; list.innerHTML='<div class="empty">還沒接上資料庫。<br>（把 Firebase 網址給慈均的助手填好就會出現）</div>'; return; }
    count.textContent="讀取中…"; list.innerHTML="";
    fetch(DB_URL.replace(/\/$/,"") + "/lianlian_feedback.json")
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data){ count.textContent="目前還沒有回饋"; list.innerHTML='<div class="empty">還沒有人留言。等孩子玩過，就會慢慢出現 🌿</div>'; return; }
        var arr=Object.keys(data).map(function(k){ return data[k]; });
        arr.reverse();
        count.textContent="共 "+arr.length+" 則回饋";
        list.innerHTML = arr.map(function(d){
          return '<div class="item"><div class="top"><span class="stars">'+stars(d["評分"])+'</span>'
            + (d["最愛的門"]?'<span class="fav">最愛：'+esc(d["最愛的門"])+'</span>':'')
            + '<span class="time">'+esc(d["時間"]||"")+'</span></div>'
            + (d["家長"]?'<div class="who">'+esc(d["家長"])+'</div>':'')
            + (d["留言"]?'<div class="comment">'+esc(d["留言"])+'</div>':'')
            + '</div>';
        }).join("");
      })
      .catch(function(){ count.textContent="讀取失敗，請重新整理"; });
  }
})();
</script>
</body>
</html>
