<style>
  :root{
    --bg:#F1EADC; --card:#FFFDF8;
    --ink:#3A352D; --ink-soft:#736C5F;
    --pebble-deep:#BBB4A4;
    --lake:#6FA8DC; --lake-deep:#4E86BE;
    --serif:'Noto Serif TC',serif; --display:'Fraunces',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;font-family:var(--serif);color:var(--ink);}
  .card{position:relative;width:370px;max-width:100%;background:var(--card);
    border-radius:24px;padding:42px 38px 26px;overflow:hidden;
    box-shadow:0 20px 50px -22px rgba(58,53,45,.32),0 2px 8px rgba(58,53,45,.06);
    border:1px solid rgba(212,207,196,.55);}
  .ripple-bg{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:520px;height:520px;pointer-events:none;}
  .ripple-bg circle{fill:none;stroke:var(--lake);stroke-width:1;opacity:.10;}
  .inner{position:relative;z-index:1;text-align:center;}
  .emblem{width:96px;height:auto;margin:0 auto 6px;display:block;}
  .eyebrow{font-family:var(--display);font-style:italic;font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--lake-deep);margin-bottom:14px;}
  .cardname{font-family:var(--serif);font-weight:600;font-size:1.5rem;letter-spacing:.14em;color:var(--ink);}
  .no{font-family:var(--display);font-weight:500;font-size:1.05rem;color:var(--lake-deep);letter-spacing:.06em;margin-top:2px;}
  .rule{width:46px;height:1px;background:var(--pebble-deep);margin:20px auto;opacity:.7;}
  .quote .mark{font-family:var(--display);font-size:2.4rem;line-height:0;color:var(--lake);opacity:.5;}
  .quote-en{font-family:var(--display);font-style:italic;font-size:1.16rem;line-height:1.5;color:var(--ink);margin:6px 14px 0;}
  .quote-cn{font-family:var(--serif);font-size:1rem;line-height:1.7;color:var(--ink-soft);margin-top:10px;letter-spacing:.02em;}
  .story{margin-top:18px;}
  .story .cn{font-family:var(--serif);font-weight:600;font-size:1.02rem;letter-spacing:.06em;color:var(--ink);}
  .story .en{font-family:var(--display);font-style:italic;font-size:.86rem;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}
  .fields{margin:24px 6px 6px;text-align:left;}
  .field{display:flex;align-items:flex-end;gap:10px;margin-top:14px;}
  .field .lab{font-family:var(--serif);font-size:.82rem;color:var(--ink-soft);white-space:nowrap;letter-spacing:.08em;}
  .field .line{flex:1;border-bottom:1.4px dotted var(--pebble-deep);height:18px;}
  /* 底部：flex 三段，左 logo · 中 品牌 · 右 蓮花 */
  .cardfoot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:6px;}
  .foot-logo img{width:42px;height:auto;display:block;}
  .brandmid{text-align:center;flex:1;padding:0 8px;}
  .brandmid .nm{font-family:var(--display);font-size:.95rem;letter-spacing:.1em;color:var(--ink);line-height:1.2;}
  .brandmid .nm small{font-family:var(--serif);font-size:.82rem;color:var(--ink-soft);letter-spacing:.16em;margin-left:5px;}
  .brandmid .slo{font-family:var(--display);font-style:italic;font-size:.62rem;letter-spacing:.04em;color:var(--lake-deep);margin-top:3px;opacity:.92;}
  .lotus{width:44px;height:auto;display:block;}
</style></head>
